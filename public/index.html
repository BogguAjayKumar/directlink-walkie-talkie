<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DirectLink // Secure Walkie-Talkie</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="state-disconnected">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a0d14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </div>
      <div class="brand-title">DirectLink</div>
    </div>
    <div class="header-badges">
      <span class="badge badge-e2ee" title="Encrypted Media Channel">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        DTLS-SRTP E2EE
      </span>
      <span id="deviceBadge" class="badge badge-device">Detecting...</span>
    </div>
  </header>

  <!-- Main View -->
  <main>
    <!-- Status & Info Card -->
    <div class="status-card">
      <div class="status-header">
        <div class="channel-tag">CHANNEL: <span id="displayRoom" class="channel-id">UNASSIGNED</span></div>
        <div class="live-indicator">
          <span class="status-dot"></span>
          <span id="statusLabel">DISCONNECTED</span>
        </div>
      </div>

      <!-- Live Oscilloscope Audio Waveform -->
      <div class="visualizer-container">
        <canvas id="oscilloscope"></canvas>
      </div>

      <div id="statusBanner" class="status-banner">TAP CONNECT TO START</div>
    </div>

    <!-- PTT Action Center -->
    <div class="ptt-section">
      <div class="ptt-halo"></div>
      <button id="pttBtn" class="ptt-button" disabled aria-label="Push To Talk">
        <svg class="ptt-icon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
        <span id="pttText" class="ptt-text">HOLD TO TALK</span>
        <span id="pttSubtext" class="ptt-subtext">AUDIO STANDBY</span>
      </button>

      <div class="keyboard-hint" id="keyboardHint">
        <span>Press &amp; hold</span>
        <span class="key-badge">SPACEBAR</span>
        <span>to speak</span>
      </div>
    </div>

    <!-- Controls & Quick Toggles -->
    <div class="controls-grid">
      <button id="btnPairing" class="btn-tactical" title="Pair Phone & Laptop">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <span>Pair Phone</span>
      </button>

      <button id="btnModeToggle" class="btn-tactical" title="Toggle PTT or Handsfree">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span id="modeText">Hold Mode</span>
      </button>

      <button id="btnSoundFx" class="btn-tactical active" title="Toggle Roger Beeps">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span>Roger Beep</span>
      </button>

      <button id="btnTunnel" class="btn-tactical" title="Enable Mobile Data / Global Internet Access">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="tunnelText">Mobile Data WAN</span>
      </button>
    </div>
  </main>

  <!-- Pairing & Network Setup Modal -->
  <div id="pairingModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-ready)" stroke-width="2">
          <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h3v3h-3zM17 17h3v3h-3zM14 17h3v3h-3zM17 14h3v3h-3z"/>
        </svg>
        <span>Intercom Pairing Setup</span>
      </div>

      <div class="input-group">
        <label class="input-label" for="inputRoom">Tactical Channel (Room ID)</label>
        <input type="text" id="inputRoom" class="input-field" placeholder="alpha-channel" spellcheck="false" autocomplete="off">
      </div>

      <div class="input-group">
        <label class="input-label" for="inputPin">Security PIN (6 Digits)</label>
        <input type="text" id="inputPin" class="input-field" placeholder="123456" maxlength="6" pattern="[0-9]*" inputmode="numeric">
      </div>

      <!-- Network Target Selector -->
      <div class="input-group">
        <label class="input-label" for="selectNetwork">Network Link Mode</label>
        <select id="selectNetwork" class="input-field">
          <option value="lan">Local Wi-Fi Network</option>
          <option value="tunnel">Mobile Data / Global Internet Tunnel</option>
        </select>
      </div>

      <!-- QR Code Preview for Phone Quick Pairing -->
      <div class="qr-preview-box" id="qrContainer">
        <img id="qrImage" alt="Pairing QR Code" src="">
        <span class="qr-caption">Scan with Phone Camera to auto-connect instantly</span>
        <button id="btnCopyLink" class="btn-tactical" style="width: 100%;">
          <span>Copy Invite Link</span>
        </button>
      </div>

      <div class="modal-actions">
        <button id="btnCancelModal" class="btn-tactical" style="display: none;">Cancel</button>
        <button id="btnConnect" class="btn-primary">Connect Intercom</button>
      </div>
    </div>
  </div>

  <!-- Hidden Audio Element for Incoming Peer Speech Stream -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- Scripts -->
  <script src="/sound-effects.js"></script>
  <script src="/app.js"></script>
</body>
</html>
